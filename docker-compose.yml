services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/New_York
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-in-production}
      # The workflows call the worker with {{$env.N8N_WEBHOOK_SECRET}} in x-n8n-secret; without these the secret is empty (401 once set).
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-}
      - WORKER_API_URL=${WORKER_API_URL:-http://worker:3001}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_PORT=3001
    depends_on:
      - redis
    profiles:
      - full

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    profiles:
      - full

volumes:
  redis_data:
  n8n_data:
